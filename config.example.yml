version: 2
task_source:
  executable: /bin/sh
  args: [internal/engine/testdata/fake-tcc2.sh]
polling:
  interval_seconds: 60
safety:
  dry_run: true
default:
  on_task_start: []
rules:
  - id: example
    match:
      task_name_contains: [Example]
    ensure:
      - type: app.start
        bundle_id: example.application
      - type: app.stop
        bundle_ids: [example.distraction, example.other]
      - type: notify
        title: Example
        message: Example task is running
        level: info
      - type: browser.block
        domains: [example.com, xn--bcher-kva.example]
